name: CI/CD Pipeline

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  # 1) 빌드 & 테스트 (CI)
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle Wrapper
        run: ./gradlew clean build -x test

  # 2) 의존성 그래프 생성 & 제출 (Dependabot Alerts)
  dependency-submission:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v4

  # 3) Docker 이미지 빌드 → Docker Hub 푸시
  docker-build-push:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build JAR
        run: ./gradlew clean bootJar -x test
        
      - name: 로그인 to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/myapp
          TAG=${{ github.sha }}
          docker build -t $IMAGE:$TAG .

      - name: Push Docker image
        run: |
          IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/myapp
          TAG=${{ github.sha }}
          docker push $IMAGE:$TAG

  # 4) EC2에 SSH → docker-compose로 배포
  deploy:
    needs: docker-build-push
    runs-on: ubuntu-latest
    steps:
      - name: EC2에 SSH 연결 및 Docker Compose 배포
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            cd ~/4ever0_BE
            git pull origin dev
            # Docker Hub에서 새 이미지 가져오기
            docker-compose pull
            # 컨테이너 재시작 (이전 컨테이너 제거 포함)
            docker-compose up -d --remove-orphans
